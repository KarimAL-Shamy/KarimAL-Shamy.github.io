<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Mathematical Clock | Karim Al-Shamy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.14/p5.js"></script>
    <script src="Clock.js"></script> 
    <style type="text/css">
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(4, 194, 201, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #04c2c9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid rgba(4, 194, 201, 0.4);
            border-radius: 20px;
            background: rgba(4, 194, 201, 0.08);
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .back-link:hover {
            background: #04c2c9;
            color: #111;
            box-shadow: 0 4px 15px rgba(4, 194, 201, 0.4);
        }
    </style>
</head>
<body>
    <a href="../../index.html#gallery" class="back-link">&#8592; Back to Portfolio</a>
    <div id="clock-container"></div>
</body>
</html>
